name: Setup Shark toolchain
description: Installs Haxe, hmm dependencies, and (optionally) runs a generic Lime setup

inputs:
  haxe-version:
    required: true
  lime-setup-target:
    required: false
    default: ""
  skip-lime-setup:
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Haxe
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ inputs.haxe-version }}

    - name: Install hmm
      shell: bash
      run: haxelib install hmm

    - name: Cache haxelib dependencies
      uses: actions/cache@v4
      with:
        path: .haxelib
        key: ${{ runner.os }}-haxelib-${{ inputs.haxe-version }}-${{ hashFiles('hmm.json') }}
        restore-keys: |
          ${{ runner.os }}-haxelib-${{ inputs.haxe-version }}-

    - name: Install dependencies
      shell: bash
      run: haxelib run hmm install

    - name: List installed haxelibs
      shell: bash
      run: haxelib list

    - name: Verify HaxeUI is installed
      shell: bash
      run: |
        if haxelib list | grep -qi "haxeui-core"; then
          echo "haxeui-core: OK"
        else
          echo "::error::haxeui-core is NOT installed. Check that hmm.json (committed to this branch) lists haxeui-core and haxeui-flixel, and that this workflow run actually picked up that version of hmm.json (not a stale cache)."
          exit 1
        fi

        if haxelib list | grep -qi "haxeui-flixel"; then
          echo "haxeui-flixel: OK"
        else
          echo "::error::haxeui-flixel is NOT installed. Check that hmm.json (committed to this branch) lists haxeui-core and haxeui-flixel, and that this workflow run actually picked up that version of hmm.json (not a stale cache)."
          exit 1
        fi

    - name: Setup Lime
      if: inputs.skip-lime-setup != 'true'
      shell: bash
      run: haxelib run lime setup -y ${{ inputs.lime-setup-target }}
