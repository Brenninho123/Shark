name: Build

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "arts/**"
  workflow_dispatch:
    inputs:
      target:
        description: "Which platform to build (leave as 'all' to build everything)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
          - linux
          - mac
          - ios
      environment:
        description: "Override SHARK_ENV (leave as 'auto' to infer from the branch/tag)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - dev
          - staging
          - production
      create_release:
        description: "Publish a GitHub release from this run (only takes effect when run against a v* tag)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  HAXE_VERSION: "4.3.7"
  ANDROID_NDK_VERSION: "21.4.7075529"
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ github.event.inputs.environment }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: ${{ runner.os }}-hxcpp-windows-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-windows-

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Build Windows
        uses: ./.github/actions/build-retry
        timeout-minutes: 15
        with:
          target: windows

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Windows-logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Windows
          path: export/windows/bin
          retention-days: 7

  build-android:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ github.event.inputs.environment }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: ${{ runner.os }}-hxcpp-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-android-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          skip-lime-setup: "true"

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime setup -y android

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Prepare Android keystore
        run: |
          mkdir -p Certificates

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > Certificates/android.keystore
            echo "SHARK_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"
            echo "SHARK_KEYSTORE_ALIAS_PASSWORD=${{ secrets.ANDROID_KEYSTORE_ALIAS_PASSWORD }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::Tagged release build requires ANDROID_KEYSTORE_BASE64 and related secrets to be configured - refusing to sign a release with a throwaway keystore."
            exit 1
          else
            keytool -genkeypair -v \
              -keystore Certificates/android.keystore \
              -alias android \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Shark, OU=Brenninho, O=Brenninho, L=Unknown, S=Unknown, C=BR"
          fi

      - name: Build Android
        uses: ./.github/actions/build-retry
        timeout-minutes: 15
        with:
          target: android

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Android-logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Android
          path: export/android/bin/app/build/outputs/apk
          retention-days: 7

  build-linux:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ github.event.inputs.environment }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: ${{ runner.os }}-hxcpp-linux-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-linux-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libvlc-dev \
            libvlccore-dev \
            vlc

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Build Linux
        uses: ./.github/actions/build-retry
        timeout-minutes: 15
        with:
          target: linux

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Linux-logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-Linux
          path: export/linux/bin
          retention-days: 7

  build-mac:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'mac'
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ github.event.inputs.environment }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: ${{ runner.os }}-hxcpp-mac-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-mac-

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
        timeout-minutes: 10

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Build macOS
        uses: ./.github/actions/build-retry
        timeout-minutes: 15
        with:
          target: mac

      - name: List build output for debugging
        if: always()
        run: |
          echo "--- top-level repo contents ---"
          ls -la
          echo "--- export directory (if any) ---"
          find export -maxdepth 4 2>/dev/null || echo "no export directory found"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-macOS-logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-macOS
          path: export
          retention-days: 7
          if-no-files-found: warn

  build-ios:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ios'
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Resolve environment
        uses: ./.github/actions/resolve-environment
        with:
          environment-input: ${{ github.event.inputs.environment }}

      - name: Set version from tag
        uses: ./.github/actions/set-version

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: .hxcpp_cache
          key: ${{ runner.os }}-hxcpp-ios-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-hxcpp-ios-

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
        timeout-minutes: 10

      - name: Ensure config.json exists
        uses: ./.github/actions/ensure-config

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Build iOS (simulator)
        uses: ./.github/actions/build-retry
        timeout-minutes: 15
        with:
          target: ios
          extra-args: "-simulator"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-iOS-logs
          path: |
            export/**/*.log
            *.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Shark-iOS
          path: export/ios/build/Release-iphonesimulator
          retention-days: 7

  build-summary:
    if: always()
    needs:
      - build-windows
      - build-android
      - build-linux
      - build-mac
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Print summary
        run: |
          echo "## Shark build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows | ${{ needs.build-windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Android | ${{ needs.build-android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux | ${{ needs.build-linux.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS | ${{ needs.build-mac.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| iOS (simulator) | ${{ needs.build-ios.result }} |" >> "$GITHUB_STEP_SUMMARY"

  create-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.create_release == 'yes' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-mac.result == 'success' &&
      needs.build-ios.result == 'success'
    needs:
      - build-windows
      - build-android
      - build-linux
      - build-mac
      - build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package artifacts as zips
        run: |
          cd release-artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Shark ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*.zip
          fail_on_unmatched_files: false
